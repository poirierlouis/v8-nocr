name: Build - Windows

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
      V8_VERSION: 15.2.124.8
      LLVM_VERSION: 22.1.8
      WINSDK_VERSION: 10.0.28000.0
      RUSTUP_HOME: D:\.rustup
      CARGO_HOME: D:\.cargo
      LIBCLANG_PATH: C:\llvm-clang\22.1.8\bin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache Windows SDK
        id: cache-winsdk
        uses: actions/cache@v6
        with:
          path: |
            C:\Program Files (x86)\Windows Kits\10\Include\${{ env.WINSDK_VERSION }}
            C:\Program Files (x86)\Windows Kits\10\Lib\${{ env.WINSDK_VERSION }}
            C:\Program Files (x86)\Windows Kits\10\bin\${{ env.WINSDK_VERSION }}
          key: winsdk-${{ env.WINSDK_VERSION }}-win64

      - name: Install Windows SDK
        if: steps.cache-winsdk.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $vsPath = (vswhere -latest -property installationPath)
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
          
          Write-Host "Installing Windows SDK ${{ env.WINSDK_VERSION }}"
          $arguments = @(
            'modify',
            '--installPath', "`"$vsPath`"",
            '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.28000',
            '--quiet', '--norestart', '--nocache', '--noUpdateInstaller'
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
            throw "Installation failed with exit code $($process.ExitCode)"
          }

      - name: Register Windows SDK
        if: steps.cache-winsdk.outputs.cache-hit == 'true'
        shell: powershell
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\"
          $fullVersion = "${{ env.WINSDK_VERSION }}"
          $productVersion = $fullVersion -replace '\.0$', ''
          
          # Keys used by Chromium's vs_toolchain.py / MSVC setup tools
          foreach ($key in @("HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots", "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots")) {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name KitsRoot10 -Value $sdkRoot -Type String
            New-Item -Path "$key\$fullVersion" -Force | Out-Null
          }
          
          # Keys used by vcvarsall.bat / winsdk.bat to locate the SDK
          foreach ($key in @("HKLM:\SOFTWARE\Microsoft\Microsoft SDKs\Windows\v10.0", "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\Windows\v10.0")) {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name InstallationFolder -Value $sdkRoot -Type String
            Set-ItemProperty -Path $key -Name ProductVersion -Value $productVersion -Type String
            Set-ItemProperty -Path $key -Name ProductName -Value "Microsoft Windows SDK for Windows $productVersion" -Type String
          }

      - name: Cache LLVM/Clang
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: C:\llvm-clang\${{ env.LLVM_VERSION }}
          key: llvm-clang-${{ env.LLVM_VERSION }}-win64

      - name: Install LLVM/Clang
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\llvm-clang"
          
          Write-Host "Downloading LLVM ${{ env.LLVM_VERSION }}"
          $ProgressPreference = 'SilentlyContinue'
          curl.exe -L -o "llvm-clang.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz"
          
          Write-Host "Installing LLVM ${{ env.LLVM_VERSION }}"
          tar -xf llvm-clang.tar.xz -C "C:\llvm-clang"
          Rename-Item -Path "C:\llvm-clang\clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc" -NewName "${{ env.LLVM_VERSION }}"

      - name: Add LLVM/Clang to PATH
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\llvm-clang\${{ env.LLVM_VERSION }}\bin"

      - name: Install Rust
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe"
          .\rustup-init.exe -y --default-toolchain nightly-2026-08-18
          
          # Add the required source code component
          #D:\.cargo\bin\rustup component add rust-src --toolchain nightly-2026-08-18
          
          # Add the binary shims directory to the GitHub path
          Add-Content -Path $env:GITHUB_PATH -Value "D:\.cargo\bin"
          
          rustc --version
          cargo --version

      - name: Install bindgen
        shell: cmd
        run: |
          cargo install bindgen-cli

      - name: Install depot_tools
        shell: cmd
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo C:\depot_tools>> %GITHUB_PATH%

      - name: Configure depot_tools
        shell: cmd
        env:
          PYTHONHTTPSVERIFY: 0
        run: |
          git config --global depot-tools.allowGlobalGitConfig true
          call gclient

      - name: Fetch V8
        shell: cmd
        run: |
          call fetch v8
          cd v8
          git checkout ${{ env.V8_VERSION }}
          call gclient sync -D

      - name: Patch V8
        shell: powershell
        run: |
          cd v8\
          git apply --3way --ignore-whitespace ..\win\x64\patches\${{ env.V8_VERSION }}\v8.patch
          cd build\
          git apply --3way --ignore-whitespace ..\..\win\x64\patches\${{ env.V8_VERSION }}\build\v8.patch
          $filePath = "rust\rust_bindgen_generator.gni"
          Select-String -Path $filePath -Pattern "libclang-path"

#      - name: Fix Patch V8
#        shell: powershell
#        run: |
#          $filePath = "v8\build\rust\rust_bindgen_generator.gni"
#          (Get-Content $filePath -Raw) -replace '(?m)^\s*"--libclang-path",\r?\n\s*rebase_path\(_libclang_path, root_build_dir\),\r?\n', '' | Set-Content $filePath -NoNewline
#          Select-String -Path $filePath -Pattern "libclang-path"

      - name: Run GN
        shell: cmd
        run: |
          cd v8\
          mkdir out\release
          copy ..\win\x64\args.gn out\release\args.gn
          call gn gen out\release

      - name: Compile V8
        shell: cmd
        run: |
          cd v8\
          call ninja -C out\release v8_monolith

      - name: Merge with Rust libraries
        shell: powershell
        run: |
          cd v8\
          Get-ChildItem -Path .\out\release\obj -Filter "*.rlib" -Recurse | Select-Object -ExpandProperty FullName | Out-File -Encoding ascii rust_libs.rsp
          lib.exe /OUT:v8_monolith.lib `
                  .\out\release\obj\v8_monolith.lib `
                  .\out\release\obj\third_party\partition_alloc\src\partition_alloc\allocator_shim.lib `
                  "@rust_libs.rsp"

      - name: Stage Artifact
        shell: cmd
        run: |
          mkdir dist\lib
          mkdir dist\include
          
          copy v8\v8_monolith.lib dist\lib\
          xcopy v8\include\*.h dist\include /E /I /Y
          copy v8\LICENSE* dist\

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v8-${{ env.V8_VERSION }}-win64
          path: dist/