name: Build - Windows

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
      V8_VERSION: 15.0.245.25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: C:\llvm-clang
          key: llvm-22.1.8-win64

      - name: Install LLVM/Clang v22
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "C:\llvm-clang"
          
          Write-Host "Downloading LLVM 22.1.8"
          $ProgressPreference = 'SilentlyContinue'
          curl.exe -L -o "llvm-clang.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
          
          Write-Host "Installing LLVM 22.1.8"
          tar -xf llvm-clang.tar.xz -C "C:\llvm-clang"
          Rename-Item -Path "C:\llvm-clang\clang+llvm-22.1.8-x86_64-pc-windows-msvc" -NewName "22.1.8"

      - name: Setup LLVM/Clang v22
        shell: powershell
        run: echo "C:\llvm-clang\22.1.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v6
        with:
          path: C:\depot_tools
          key: depot-tools-win64

      - name: Install depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools

      - name: Setup depot_tools
        shell: cmd
        run: |
          git config --global depot-tools.allowGlobalGitConfig true
          echo C:\depot_tools>> %GITHUB_PATH%

      - name: Run depot_tools
        shell: cmd
        env:
          PYTHONHTTPSVERIFY: 0
        run: |
          call gclient

      - name: Cache V8 Source
        id: cache-v8
        uses: actions/cache@v6
        with:
          path: |
            v8
            .gclient
            .gclient_entries
          key: v8-${{ env.V8_VERSION }}-win64

      - name: Fetch V8
        shell: cmd
        run: |
          if not exist v8 call fetch v8
          cd v8
          git checkout ${{ env.V8_VERSION }}
          call gclient sync -D --no-history --reset

      - name: Patch V8
        shell: cmd
        run: |
          cd v8\
          git apply --3way --ignore-whitespace ..\win\x64\patches\${{ env.V8_VERSION }}\v8.patch
          
          cd build
          git apply --3way --ignore-whitespace ..\..\win\x64\patches\${{ env.V8_VERSION }}\build\v8.patch

      - name: Run GN
        shell: cmd
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
        run: |
          cd v8\
          mkdir out\release
          copy ..\win\x64\args.gn out\release\args.gn
          call gn gen out\release

      - name: Compile V8
        shell: cmd
        run: |
          cd v8\
          call ninja -C out\release v8_monolith

      - name: Stage Artifact
        shell: cmd
        run: |
          mkdir dist\lib
          mkdir dist\include
          
          copy v8\out\release\obj\v8_monolith.lib dist\lib\
          xcopy v8\include\*.h dist\include /E /I /Y
          copy v8\LICENSE* dist\

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v8-${{ env.V8_VERSION }}-win64
          path: dist/